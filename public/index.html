<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShowMo</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.12.6/dist/shaka-player.compiled.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="live-dot" id="syncDot" aria-hidden="true"></span>
        <a href="/" class="brand-link" id="homeBrandLink" title="Go to ShowMo home">
          <h1>ShowMo</h1>
          <span class="brand-sub">by ishmam</span>
        </a>
        <span class="meta-pill" id="channelCount">Loading…</span>
      </div>
      <button type="button" id="topBackBtn" class="btn-subtle btn-back hidden">← Back</button>
    </header>

    <section class="browse-view" id="browseView">
      <div class="browse-header">
        <div class="browse-title-group">
          <button type="button" id="browseBackBtn" class="btn-subtle hidden">← Categories</button>
          <h2 id="browseTitle">Categories</h2>
        </div>
        <input
          type="search"
          id="browseSearch"
          placeholder="Search categories or channels… (/)"
          autocomplete="off"
          aria-label="Search categories or channels"
        />
      </div>

      <div class="category-grid" id="categoryGrid">
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton-line wide"></span><span class="skeleton-line short"></span></div>
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton-line wide"></span><span class="skeleton-line short"></span></div>
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton-line wide"></span><span class="skeleton-line short"></span></div>
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton-line wide"></span><span class="skeleton-line short"></span></div>
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton-line wide"></span><span class="skeleton-line short"></span></div>
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton-line wide"></span><span class="skeleton-line short"></span></div>
      </div>
      <ul class="browse-channel-list hidden" id="browseChannelList" role="listbox" aria-label="Channels"></ul>
    </section>

    <main class="workspace hidden" id="playerView">
      <section class="player-pane">
        <div class="video-frame">
          <video id="video" controls playsinline autoplay></video>
          <div class="player-overlay hidden" id="playerOverlay">
            <p id="overlayMessage"></p>
          </div>
        </div>

        <div class="now-playing">
          <div class="now-playing-info">
            <img id="activeLogo" class="channel-logo hidden" alt="" />
            <div>
              <div class="now-title-row">
                <h2 id="activeTitle">No channel selected</h2>
                <span class="badge badge-live hidden" id="activeLivePill"><span class="live-pulse"></span>LIVE</span>
                <span class="badge hidden" id="activeFormat"></span>
                <span class="badge badge-drm hidden" id="activeDrm">ClearKey</span>
              </div>
              <p class="now-sub" id="activeGroup"></p>
            </div>
          </div>

          <div class="now-actions">
            <label class="toggle" title="Route stream requests through server proxy for CORS and custom headers">
              <input type="checkbox" id="proxyToggle" />
              <span>Proxy</span>
            </label>
            <button type="button" id="retryBtn" class="btn-subtle hidden">Retry</button>
            <button type="button" id="shareBtn" class="btn-subtle btn-share" title="Copy direct link to this channel">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              </svg>
              <span id="shareBtnLabel">Share</span>
            </button>
            <button type="button" id="backToCategoriesBtn" class="btn-subtle">Categories</button>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-filters">
          <button type="button" id="sidebarBackBtn" class="btn-subtle hidden">← Categories</button>
          <input
            type="search"
            id="searchInput"
            placeholder="Search channels… (/)"
            autocomplete="off"
            aria-label="Search channels"
          />
        </div>

        <ul class="channel-list" id="channelList" role="listbox" aria-label="Channels"></ul>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
